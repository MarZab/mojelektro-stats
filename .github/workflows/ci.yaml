name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python comes from .python-version (3.14), the version the latest Home
      # Assistant requires (REQUIRED_PYTHON_VER). Keep both in step.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pyright
      - run: uv run pytest --cov
