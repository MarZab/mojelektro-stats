name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          manifest=$(jq -r .version custom_components/mojelektro_stats/manifest.json)
          [ "v$manifest" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest v$manifest"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # vX.Y.Z -> stable (latest). vX.Y.ZaN / bN / rcN -> pre-release, which
          # HACS only offers to users who enabled "Show beta versions".
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=(--latest)
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            channel=(--prerelease)
          else
            echo "tag $GITHUB_REF_NAME is neither vX.Y.Z nor vX.Y.Z(a|b|rc)N"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "${channel[@]}"
