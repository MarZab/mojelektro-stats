name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # HACS reads the license GitHub detects on the default branch, so on a
          # PR it can't see LICENSE until merge. Pushes to main and the nightly
          # run still enforce it.
          ignore: ${{ github.event_name == 'pull_request' && 'license' || '' }}

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
