# Moj Elektro Stats — HACS Home Assistant integration
#
# The shipped product is custom_components/mojelektro_stats/ (self-contained, no PyPI deps).
# This file configures developer tooling only: lint, typecheck, tests, and the
# optional repo-local CLI under tools/cli/. Nothing here is published or installed into HA.

[project]
name = "mojelektro-stats"
version = "1.0.0"
description = "Home Assistant HACS integration for Moj Elektro electricity data"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[tool.uv]
package = false
# Test against the latest Home Assistant. pytest-homeassistant-custom-component
# pins an exact HA version and lags behind HA releases; raise this floor when
# a new HA ships and drop it once the plugin catches up.
override-dependencies = ["homeassistant>=2026.11.1"]

[tool.uv.sources]
ha-test-compat = { path = "tools/ha_test_compat", editable = true }

[dependency-groups]
dev = [
  # CLI (tools/cli/) — not part of the HACS install
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "questionary>=2.0",
  # Tests (tests/)
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-recording>=0.13",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "syrupy>=4.6",
  "freezegun>=1.5",
  "pytest-homeassistant-custom-component>=0.13",
  # Makes the plugin load on the latest HA; see tools/ha_test_compat.
  "ha-test-compat",
  # Lint + types
  "ruff>=0.5",
  "mypy>=1.10",
  "pyright>=1.1.370",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
# Loaded before entry-point plugins; see tools/ha_test_compat.
addopts = "-p ha_test_compat"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tools", "custom_components/mojelektro_stats/lib"]
markers = ["ha: Home Assistant integration tests"]

[tool.coverage.run]
source = [
  "custom_components/mojelektro_stats",
  "custom_components/mojelektro_stats/lib/mojelektro_api",
  "tools/cli",
]
omit = ["custom_components/mojelektro_stats/lib/mojelektro_api/_generated/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
python_version = "3.14"
strict = true
files = [
  "custom_components/mojelektro_stats",
  "tools/cli",
  "tools/scripts/release.py",
]
explicit_package_bases = true
namespace_packages = true
mypy_path = ["custom_components/mojelektro_stats/lib", ".", "tools"]

[[tool.mypy.overrides]]
module = ["custom_components.mojelektro_stats.*"]
# - misc:        HA decorator typing; HA itself isn't fully strict-typed
# - attr-defined: HA exports some documented helpers via re-export without listing
#                 them in __all__ (e.g. recorder.util.get_instance).
disable_error_code = ["misc", "attr-defined"]

[tool.pyright]
include = [
  "custom_components/mojelektro_stats",
  "tools/cli",
  "tools/scripts/release.py",
]
extraPaths = ["custom_components/mojelektro_stats/lib", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
